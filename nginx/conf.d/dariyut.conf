# ── Reverse proxy для «Дари Уют» ─────────────────────────────────────────────
# Один домен: фронт (Nuxt SSR) на «/», бэкенд (FastAPI) на API-путях.
# Домен дари-уют.рф в punycode: xn----7sblr3bog2g.xn--p1ai

# Поддержка websocket-апгрейда.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dariyut_frontend {
    server frontend:3000;
}

upstream dariyut_backend {
    server backend:8000;
}

# Пути, которые обслуживает бэкенд (FastAPI). Всё остальное идёт на фронт.
# Используется в location-блоках ниже.

# ── HTTP: ACME-челлендж для Let's Encrypt + редирект на HTTPS ────────────────
server {
    listen 80;
    listen [::]:80;
    server_name xn----7sblr3bog2g.xn--p1ai www.xn----7sblr3bog2g.xn--p1ai;

    # Проверка домена сертификатом (certbot webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn----7sblr3bog2g.xn--p1ai www.xn----7sblr3bog2g.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn----7sblr3bog2g.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----7sblr3bog2g.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Загрузка изображений товаров в админке.
    client_max_body_size 20m;

    # Общие заголовки прокси.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── Бэкенд (FastAPI): API, медиа, админка, документация ──────────────────
    location ~ ^/(auth|orders|products|categories|quotes|media|admin|docs|redoc|openapi\.json|health) {
        proxy_pass http://dariyut_backend;
    }

    # ── Фронтенд (Nuxt SSR): всё остальное ───────────────────────────────────
    location / {
        proxy_pass http://dariyut_frontend;
    }
}

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="МАХРОВЫЙ ХАЛАТ">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7f1"/>
      <stop offset="1" stop-color="#f0e9dd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="terry" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 13 h9 M17 13 h9" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#glow)"/>
  <g transform="translate(400 350)">
    <!-- стопка из трёх сложенных махровых полотенец -->
    <g>
      <rect x="-175" y="-96" width="350" height="82" rx="41" fill="#5f8f86"/>
      <rect x="-175" y="-96" width="350" height="82" rx="41" fill="url(#terry)"/>
      <rect x="-175" y="0" width="350" height="82" rx="41" fill="#5f8f86" fill-opacity="0.82"/>
      <rect x="-175" y="0" width="350" height="82" rx="41" fill="url(#terry)"/>
      <rect x="-175" y="96" width="350" height="82" rx="41" fill="#5f8f86" fill-opacity="0.64"/>
      <rect x="-175" y="96" width="350" height="82" rx="41" fill="url(#terry)"/>
      <!-- акцентная кайма -->
      <rect x="86" y="-96" width="30" height="82" fill="#c96a48"/>
      <rect x="86" y="0" width="30" height="82" fill="#c96a48" fill-opacity="0.85"/>
      <rect x="86" y="96" width="30" height="82" fill="#c96a48" fill-opacity="0.7"/>
    </g>
  </g>
  <text x="400" y="600" text-anchor="middle" font-family="'Onest', system-ui, sans-serif" font-size="30" letter-spacing="5" fill="#1f1c19" fill-opacity="0.72">МАХРОВЫЙ ХАЛАТ</text>
  <text x="400" y="642" text-anchor="middle" font-family="'Onest', system-ui, sans-serif" font-size="18" letter-spacing="3" fill="#136a63" fill-opacity="0.6">МАХРОВЫЙ МИР · ОПТ</text>
</svg>

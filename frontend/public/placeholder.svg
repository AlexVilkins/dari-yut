<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="Махровое изделие">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7f1"/>
      <stop offset="1" stop-color="#f0e9dd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400 360)">
    <!-- стопка сложенных полотенец -->
    <g>
      <rect x="-150" y="-70" width="300" height="70" rx="35" fill="#136a63" fill-opacity="0.85"/>
      <rect x="-150" y="10" width="300" height="70" rx="35" fill="#136a63" fill-opacity="0.6"/>
      <rect x="-150" y="90" width="300" height="70" rx="35" fill="#136a63" fill-opacity="0.4"/>
      <rect x="70" y="-70" width="26" height="70" fill="#c96a48" fill-opacity="0.9"/>
      <rect x="70" y="10" width="26" height="70" fill="#c96a48" fill-opacity="0.75"/>
      <rect x="70" y="90" width="26" height="70" fill="#c96a48" fill-opacity="0.55"/>
    </g>
  </g>
  <text x="400" y="560" text-anchor="middle" font-family="'Onest', system-ui, sans-serif" font-size="30" letter-spacing="6" fill="#136a63" fill-opacity="0.8">МАХРОВЫЙ МИР</text>
  <text x="400" y="602" text-anchor="middle" font-family="'Onest', system-ui, sans-serif" font-size="19" letter-spacing="2" fill="#136a63" fill-opacity="0.5">махровые изделия оптом</text>
</svg>

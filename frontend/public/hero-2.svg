<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760" viewBox="0 0 600 760" role="img" aria-label="Домашний текстиль с именной вышивкой">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ece1"/>
      <stop offset="1" stop-color="#e7d8c2"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="stitch2" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 16 h11 M21 16 h11" stroke="#1f4d43" stroke-opacity="0.07" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="600" height="760" fill="url(#bg2)"/>
  <rect width="600" height="760" fill="url(#stitch2)"/>
  <rect width="600" height="760" fill="url(#glow2)"/>

  <!-- Стопка сложенных полотенец -->
  <g>
    <rect x="120" y="470" width="360" height="92" rx="14" fill="#e8dcc6"/>
    <rect x="120" y="470" width="360" height="92" rx="14" fill="url(#stitch2)"/>
    <line x1="120" y1="516" x2="480" y2="516" stroke="#1f4d43" stroke-opacity="0.12" stroke-width="3" stroke-dasharray="10 8"/>

    <rect x="140" y="372" width="320" height="92" rx="14" fill="#f0e7d6"/>
    <rect x="140" y="372" width="320" height="92" rx="14" fill="url(#stitch2)"/>
    <line x1="140" y1="418" x2="460" y2="418" stroke="#b84a3c" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="10 8"/>

    <rect x="160" y="262" width="280" height="104" rx="16" fill="#fbf7ef"/>
    <rect x="160" y="262" width="280" height="104" rx="16" fill="url(#stitch2)"/>
  </g>

  <!-- Вышитая монограмма на верхнем полотенце -->
  <g transform="translate(300 314)">
    <circle r="42" fill="none" stroke="#1f4d43" stroke-opacity="0.4" stroke-width="2"/>
    <circle r="42" fill="none" stroke="#1f4d43" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
    <text x="0" y="15" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="42" font-weight="600" fill="#1f4d43">ДУ</text>
  </g>

  <text x="300" y="642" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="40" font-style="italic" fill="#1f4d43">домашний текстиль</text>
  <text x="300" y="684" text-anchor="middle" font-family="'Onest', system-ui, sans-serif" font-size="17" letter-spacing="7" fill="#1f4d43" fill-opacity="0.55">ИМЕННАЯ ВЫШИВКА</text>
</svg>

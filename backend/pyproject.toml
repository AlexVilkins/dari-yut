[project]
name = "dari-yut-backend"
version = "0.1.0"
description = "Бэкенд интернет-магазина «Дари Уют» (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "sqladmin==0.20.1",
    "itsdangerous==2.2.0",
    # Прод-БД (PostgreSQL). В dev по умолчанию SQLite, драйвер не нужен.
    "psycopg2-binary==2.9.10",
]

[dependency-groups]
# Зависимости для разработки/тестов (httpx нужен для FastAPI TestClient).
dev = [
    "httpx==0.28.1",
]

[tool.uv]
package = false
